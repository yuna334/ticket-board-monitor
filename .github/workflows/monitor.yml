name: Ticket Board Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check ticket board
        env:
          DISCORD_WEBHOOK: ${{ secrets.WEBHOOK_URL }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          const URL = 'https://ticket.tickebo.jp/show/event.html';
          const WEBHOOK = process.env.DISCORD_WEBHOOK;

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            try {
              await page.goto(URL, {
                waitUntil: 'networkidle',
                timeout: 60000
              });

              await page.waitForTimeout(5000);

              const text = await page.locator('body').innerText();

              const dates = ['8/13', '8/14', '8/15', '8/16'];
              const found = [];

              for (const date of dates) {
                const index = text.indexOf(date);

                if (index === -1) continue;

                const area = text.substring(index, index + 500);

                if (!area.includes('出品待ち')) {
                  found.push(date);
                }
              }

              console.log('対象日:', dates);
              console.log('空きが見つかった日:', found);

              if (found.length > 0) {
                await fetch(WEBHOOK, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    content:
                      `🎫 チケットボードに動きがありました！\n\n` +
                      found.map(date => `・${date}`).join('\n') +
                      `\n\n${URL}`
                  })
                });

                console.log('Discord通知を送信しました。');
              } else {
                console.log('現在、対象日の出品はありません。');
              }

            } catch (error) {
              console.error(error);
              process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })();
          EOF
